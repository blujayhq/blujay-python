[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blujay"
dynamic = ["version"]
description = "Official Python library for the Blujay API: send and receive iMessage, RCS and SMS."
authors = [{ name = "Blujay", email = "support@blujay.io" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["blujay", "imessage", "rcs", "sms", "messaging", "api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "pydantic-core>=2.0.0",
  "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.10.0,<4", "httpx-aiohttp==0.1.8"]

[project.urls]
Homepage = "https://docs.blujay.io"
Documentation = "https://docs.blujay.io/api-reference"
Repository = "https://github.com/blujayhq/blujay-python"
Changelog = "https://github.com/blujayhq/blujay-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/blujayhq/blujay-python/issues"

[tool.hatch.version]
path = "src/blujay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blujay"]

[tool.hatch.build.targets.sdist]
include = ["src/blujay", "README.md", "reference.md", "CHANGELOG.md", "LICENSE", "examples"]
